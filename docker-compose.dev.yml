services:
  postgres:
    image: postgres:15
    container_name: blog-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_APP_DATABASE:-blog}
      POSTGRES_USER: ${POSTGRES_USER:-blog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      KEYCLOAK_DATABASE: ${KEYCLOAK_DATABASE:-keycloak}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blog} -d ${POSTGRES_APP_DATABASE:-blog}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - blog-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.0
    container_name: blog-keycloak
    command: start-dev
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DATABASE:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-blog}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-password}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "9000:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - blog-network

volumes:
  postgres_data:

networks:
  blog-network:
    driver: bridge
